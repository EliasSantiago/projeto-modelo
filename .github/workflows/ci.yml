name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo ref quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    env:
      # Valores dummy: o gate roda sem banco/secrets reais. O build valida
      # tipos e gera as rotas; nenhuma query é executada em tempo de build.
      DATABASE_URL: postgresql://user:password@localhost:5432/db?sslmode=require
      AUTH_SECRET: ci-placeholder-secret-not-used-in-runtime
      NEXT_PUBLIC_APP_NAME: Projeto Modelo
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
