name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo ref quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Valores dummy: o gate roda sem banco/secrets reais. O build valida tipos e
# gera as rotas; nenhuma query é executada em tempo de build, e os testes E2E
# só exercitam rotas que não tocam no banco (gate de acesso).
env:
  DATABASE_URL: postgresql://user:password@localhost:5432/db?sslmode=require
  AUTH_SECRET: ci-placeholder-secret-not-used-in-runtime
  NEXT_PUBLIC_APP_NAME: Projeto Modelo
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--with-deps` traz as libs de sistema do Chromium no runner limpo.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # O webServer do playwright.config faz `build && start` quando CI=true.
      - name: Run E2E
        run: pnpm test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: auditoria de dependências
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Falha só em vulnerabilidade alta/crítica: barulho de severidade baixa
      # em devDependency travaria o merge sem reduzir risco real.
      - name: pnpm audit
        run: pnpm audit --audit-level high
